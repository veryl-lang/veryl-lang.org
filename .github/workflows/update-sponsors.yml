name: Update Sponsors

on:
  workflow_dispatch:
  # Re-enable the daily schedule once SPONSORKIT_OPENCOLLECTIVE_KEY is set as a
  # repository secret (and there are backers to show).
  # schedule:
  #   - cron: '0 0 * * *'  # daily at 00:00 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: update-sponsors
  cancel-in-progress: true

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate sponsors image (Open Collective)
        # Install sponsorkit locally first: sponsor.config.ts does
        # `import ... from 'sponsorkit'`, which a bare `npx sponsorkit` cannot
        # resolve from the project directory.
        run: |
          npm install sponsorkit@latest
          npx sponsorkit
        env:
          # PAT with `read:user` and `read:org` scopes.
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
          # API key from https://opencollective.com/applications
          SPONSORKIT_OPENCOLLECTIVE_KEY: ${{ secrets.SPONSORKIT_OPENCOLLECTIVE_KEY }}
          SPONSORKIT_OPENCOLLECTIVE_SLUG: veryl

      - name: Commit updated image
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore: update sponsors.svg [skip ci]'
          add: 'static/img/sponsors.svg'
          default_author: github_actions

      # The image is served first-party from static/img. A bot commit made with
      # GITHUB_TOKEN does not trigger the push-based Deploy workflow, so dispatch
      # it explicitly (workflow_dispatch is allowed with GITHUB_TOKEN).
      - name: Trigger site deploy if the image changed
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
